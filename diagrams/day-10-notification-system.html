<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>발송 요청과 실제 전송을 분리하라</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:1200px;height:632px;overflow:hidden}body{background:#f5f5f5;font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}svg{display:block;width:1200px;height:632px}.eyebrow,.step{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace;font-size:9px;font-weight:600;letter-spacing:.14em;fill:#4f5d75}.title{font-size:34px;font-weight:700;fill:#2d3142}.question{font-size:16px;fill:#4f5d75}.card{fill:#fff;stroke:rgba(45,49,66,.22)}.card.focal{fill:rgba(235,108,54,.07);stroke:#eb6c36;stroke-width:1.4}.card-title{font-size:16px;font-weight:700;fill:#2d3142}.card-copy{font-size:14px;fill:#4f5d75}.rule{stroke:rgba(45,49,66,.12)}.arrow{stroke:#4f5d75;stroke-width:1.2}.takeaway-box{fill:#2d3142}.takeaway-label{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace;font-size:9px;font-weight:600;letter-spacing:.14em;fill:#eb6c36}.takeaway{font-size:18px;font-weight:600;fill:#fff}</style></head>
<body><svg viewBox="0 0 1200 632" role="img" aria-labelledby="day-10-notification-system-title day-10-notification-system-desc"><title id="day-10-notification-system-title">발송 요청과 실제 전송을 분리하라</title><desc id="day-10-notification-system-desc">알림 채널이 늘어도 발송 흐름을 어떻게 단순하게 유지할까?</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs><rect width="1200" height="632" fill="#f5f5f5"/><text x="64" y="42" class="eyebrow">SYSTEM DESIGN DAILY / DAY 10</text><text x="64" y="88" class="title">발송 요청과 실제 전송을 분리하라</text><text x="64" y="132" class="question">알림 채널이 늘어도 발송 흐름을 어떻게 단순하게 유지할까?</text><line x1="296" y1="298" x2="340" y2="298" class="arrow" marker-end="url(#arrow)"/><line x1="576" y1="298" x2="620" y2="298" class="arrow" marker-end="url(#arrow)"/><line x1="856" y1="298" x2="900" y2="298" class="arrow" marker-end="url(#arrow)"/><g><rect class="card" x="64" y="188" width="232" height="220" rx="10"/><text x="84" y="214" class="step">01</text><text x="84" y="230" class="card-title">WHY: 알림은 외부</text><text x="84" y="252" class="card-title">시스템의 실패를 품는다</text><line x1="84" y1="284" x2="276" y2="284" class="rule"/><text x="84" y="312" class="card-copy">알림 요청을 받은 순간과</text><text x="84" y="336" class="card-copy">사용자가 실제 메시지를 받은</text><text x="84" y="360" class="card-copy">순간은 다르다</text></g><g><rect class="card" x="344" y="188" width="232" height="220" rx="10"/><text x="364" y="214" class="step">02</text><text x="364" y="230" class="card-title">WHAT: 공통 접수와</text><text x="364" y="252" class="card-title">채널별 전송</text><line x1="364" y1="284" x2="556" y2="284" class="rule"/><text x="364" y="312" class="card-copy">알림 API는 Trigger</text><text x="364" y="336" class="card-copy">Service가 채널의 세부</text><text x="364" y="360" class="card-copy">구현을 몰라도 되게 한다</text></g><g><rect class="card focal" x="624" y="188" width="232" height="220" rx="10"/><text x="644" y="214" class="step">03</text><text x="644" y="230" class="card-title">HOW: 신뢰성은</text><text x="644" y="252" class="card-title">상태와 재처리에서</text><line x1="644" y1="284" x2="836" y2="284" class="rule"/><text x="644" y="312" class="card-copy">먼저 Notification</text><text x="644" y="336" class="card-copy">Log에 이벤트와 상태를</text><text x="644" y="360" class="card-copy">저장한다</text></g><g><rect class="card" x="904" y="188" width="232" height="220" rx="10"/><text x="924" y="214" class="step">04</text><text x="924" y="230" class="card-title">사용자 설정과 Rate</text><text x="924" y="252" class="card-title">Limit</text><line x1="924" y1="284" x2="1116" y2="284" class="rule"/><text x="924" y="312" class="card-copy">사용자는 채널과 알림 종류별로</text><text x="924" y="336" class="card-copy">수신을 끌 수 있어야 한다</text></g><rect x="64" y="452" width="1072" height="124" rx="10" class="takeaway-box"/><text x="88" y="482" class="takeaway-label">TAKEAWAY</text><text x="88" y="502" class="takeaway">알림 시스템은 메시지를 보내는 코드가 아니라, 발송 요청과 외부 Provider의 실패를 분리해 끝까지 추적하는</text><text x="88" y="530" class="takeaway">파이프라인이다.</text><text x="1136" y="610" text-anchor="end" class="eyebrow">LIQUIDSLR / SYSTEM-DESIGN-NOTES</text></svg></body></html>
