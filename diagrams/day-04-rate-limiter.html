<style>*{box-sizing:border-box}html,body{margin:0;width:1200px;height:632px;overflow:hidden}body{background:#f5f5f5;font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}svg{display:block;width:1200px;height:632px}.eyebrow,.step{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace;font-size:9px;font-weight:600;letter-spacing:.14em;fill:#4f5d75}.title{font-size:34px;font-weight:700;fill:#2d3142}.question{font-size:16px;fill:#4f5d75}.card{fill:#fff;stroke:rgba(45,49,66,.22)}.card.focal{fill:rgba(235,108,54,.07);stroke:#eb6c36;stroke-width:1.4}.card-title{font-size:16px;font-weight:700;fill:#2d3142}.card-copy{font-size:14px;fill:#4f5d75}.rule{stroke:rgba(45,49,66,.12)}.arrow{stroke:#4f5d75;stroke-width:1.2}.takeaway-box{fill:#2d3142}.takeaway-label{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace;font-size:9px;font-weight:600;letter-spacing:.14em;fill:#eb6c36}.takeaway{font-size:18px;font-weight:600;fill:#fff}</style></head>
<body><svg viewBox="0 0 1200 632" role="img" aria-labelledby="day-04-rate-limiter-title day-04-rate-limiter-desc"><title id="day-04-rate-limiter-title">제한은 차단이 아니라 공정한 용량 배분이다</title><desc id="day-04-rate-limiter-desc">요청을 어디에서, 어떤 기준으로 제한해야 할까?</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs><rect width="1200" height="632" fill="#f5f5f5"/><text x="64" y="42" class="eyebrow">SYSTEM DESIGN DAILY / DAY 04</text><text x="64" y="88" class="title">제한은 차단이 아니라 공정한 용량 배분이다</text><text x="64" y="132" class="question">요청을 어디에서, 어떤 기준으로 제한해야 할까?</text><line x1="296" y1="298" x2="340" y2="298" class="arrow" marker-end="url(#arrow)"/><line x1="576" y1="298" x2="620" y2="298" class="arrow" marker-end="url(#arrow)"/><line x1="856" y1="298" x2="900" y2="298" class="arrow" marker-end="url(#arrow)"/><g><rect class="card" x="64" y="188" width="232" height="220" rx="10"/><text x="84" y="214" class="step">01</text><text x="84" y="230" class="card-title">WHY: 서버가 죽기</text><text x="84" y="252" class="card-title">전에 약속을 지킨다</text><line x1="84" y1="284" x2="276" y2="284" class="rule"/><text x="84" y="312" class="card-copy">서버가 감당할 수 있는 요청보다</text><text x="84" y="336" class="card-copy">더 많이 받으면 지연시간이 먼저</text><text x="84" y="360" class="card-copy">늘고, 타임아웃과 재시도가…</text></g><g><rect class="card" x="344" y="188" width="232" height="220" rx="10"/><text x="364" y="214" class="step">02</text><text x="364" y="230" class="card-title">WHAT: 알고리즘은</text><text x="364" y="252" class="card-title">정책을 표현하는…</text><line x1="364" y1="284" x2="556" y2="284" class="rule"/><text x="364" y="312" class="card-copy">버킷에 일정한 속도로 토큰을</text><text x="364" y="336" class="card-copy">채우고 요청마다 토큰을 하나</text><text x="364" y="360" class="card-copy">쓴다</text></g><g><rect class="card focal" x="624" y="188" width="232" height="220" rx="10"/><text x="644" y="214" class="step">03</text><text x="644" y="230" class="card-title">HOW: 정책, 키,</text><text x="644" y="252" class="card-title">저장소, 응답을 함께…</text><line x1="644" y1="284" x2="836" y2="284" class="rule"/><text x="644" y="312" class="card-copy">Rate Limiter는 보통</text><text x="644" y="336" class="card-copy">서버나 API Gateway에</text><text x="644" y="360" class="card-copy">둔다</text></g><g><rect class="card" x="904" y="188" width="232" height="220" rx="10"/><text x="924" y="214" class="step">04</text><text x="924" y="230" class="card-title">실무 예와 운영 기준</text><line x1="924" y1="284" x2="1116" y2="284" class="rule"/><text x="924" y="312" class="card-copy">쿠폰 발급 API는 사용자당</text><text x="924" y="336" class="card-copy">분당 3회, IP당 초당</text><text x="924" y="360" class="card-copy">20회, 전체 시스템 초당…</text></g><rect x="64" y="452" width="1072" height="124" rx="10" class="takeaway-box"/><text x="88" y="482" class="takeaway-label">TAKEAWAY</text><text x="88" y="502" class="takeaway">Rate Limiter는 요청을 막는 벽이 아니라, 제한된 용량을 사용자와 기능 사이에 배분하는 정책 엔진이다.</text><text x="1136" y="610" text-anchor="end" class="eyebrow">LIQUIDSLR / SYSTEM-DESIGN-NOTES</text></svg></body></html>
