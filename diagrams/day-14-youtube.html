1="284" x2="836" y2="284" class="rule"/><text x="644" y="312" class="card-copy">트랜스코딩은 계산 비용이 크고</text><text x="644" y="336" class="card-copy">실패 가능성이 있다</text></g><g><rect class="card" x="904" y="188" width="232" height="220" rx="10"/><text x="924" y="214" class="step">04</text><text x="924" y="230" class="card-title">적응형 스트리밍</text><line x1="924" y1="284" x2="1116" y2="284" class="rule"/><text x="924" y="312" class="card-copy">HLS나 MPEG-DASH는</text><text x="924" y="336" class="card-copy">영상을 짧은 세그먼트와 여러</text><text x="924" y="360" class="card-copy">품질로 나눈다</text></g><rect x="64" y="452" width="1072" height="124" rx="10" class="takeaway-box"/><text x="88" y="482" class="takeaway-label">TAKEAWAY</text><text x="88" y="502" class="takeaway">동영상 플랫폼은 원본을 재시도 가능한 작업으로 바꾸고 재생 가능한 조각으로 배포하는 시스템이다.</text><text x="1136" y="610" text-anchor="end" class="eyebrow">LIQUIDSLR / SYSTEM-DESIGN-NOTES</text></svg></body></html>
