<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>복제본 수보다 읽기와 쓰기의 약속이 중요하다</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:1200px;height:632px;overflow:hidden}body{background:#f5f5f5;font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}svg{display:block;width:1200px;height:632px}.eyebrow,.step{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace;font-size:9px;font-weight:600;letter-spacing:.14em;fill:#4f5d75}.title{font-size:34px;font-weight:700;fill:#2d3142}.question{font-size:16px;fill:#4f5d75}.card{fill:#fff;stroke:rgba(45,49,66,.22)}.card.focal{fill:rgba(235,108,54,.07);stroke:#eb6c36;stroke-width:1.4}.card-title{font-size:16px;font-weight:700;fill:#2d3142}.card-copy{font-size:14px;fill:#4f5d75}.rule{stroke:rgba(45,49,66,.12)}.arrow{stroke:#4f5d75;stroke-width:1.2}.takeaway-box{fill:#2d3142}.takeaway-label{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace;font-size:9px;font-weight:600;letter-spacing:.14em;fill:#eb6c36}.takeaway{font-size:18px;font-weight:600;fill:#fff}</style></head>
<body><svg viewBox="0 0 1200 632" role="img" aria-labelledby="day-06-key-value-store-title day-06-key-value-store-desc"><title id="day-06-key-value-store-title">복제본 수보다 읽기와 쓰기의 약속이 중요하다</title><desc id="day-06-key-value-store-desc">가용성과 일관성 사이에서 무엇을 선택해야 할까?</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs><rect width="1200" height="632" fill="#f5f5f5"/><text x="64" y="42" class="eyebrow">SYSTEM DESIGN DAILY / DAY 06</text><text x="64" y="88" class="title">복제본 수보다 읽기와 쓰기의 약속이 중요하다</text><text x="64" y="132" class="question">가용성과 일관성 사이에서 무엇을 선택해야 할까?</text><line x1="296" y1="298" x2="340" y2="298" class="arrow" marker-end="url(#arrow)"/><line x1="576" y1="298" x2="620" y2="298" class="arrow" marker-end="url(#arrow)"/><line x1="856" y1="298" x2="900" y2="298" class="arrow" marker-end="url(#arrow)"/><g><rect class="card" x="64" y="188" width="232" height="220" rx="10"/><text x="84" y="214" class="step">01</text><text x="84" y="230" class="card-title">WHY: 네트워크</text><text x="84" y="252" class="card-title">단절은 예외가 아니라…</text><line x1="84" y1="284" x2="276" y2="284" class="rule"/><text x="84" y="312" class="card-copy">한 서버의 메모리에 Hash</text><text x="84" y="336" class="card-copy">Table을 두면 빠르지만</text><text x="84" y="360" class="card-copy">용량과 가용성에 한계가 있다</text></g><g><rect class="card" x="344" y="188" width="232" height="220" rx="10"/><text x="364" y="214" class="step">02</text><text x="364" y="230" class="card-title">WHAT: 파티션,</text><text x="364" y="252" class="card-title">복제, Quorum</text><line x1="364" y1="284" x2="556" y2="284" class="rule"/><text x="364" y="312" class="card-copy">Consistent</text><text x="364" y="336" class="card-copy">Hashing으로 키 공간을</text><text x="364" y="360" class="card-copy">여러 노드에 나누고 각 키를</text></g><g><rect class="card focal" x="624" y="188" width="232" height="220" rx="10"/><text x="644" y="214" class="step">03</text><text x="644" y="230" class="card-title">HOW: 쓰기 경로와</text><text x="644" y="252" class="card-title">읽기 경로를 따로…</text><line x1="644" y1="284" x2="836" y2="284" class="rule"/><text x="644" y="312" class="card-copy">쓰기에서는 먼저 Commit</text><text x="644" y="336" class="card-copy">Log에 기록해 장애 후 복구할</text><text x="644" y="360" class="card-copy">근거를 남긴다</text></g><g><rect class="card" x="904" y="188" width="232" height="220" rx="10"/><text x="924" y="214" class="step">04</text><text x="924" y="230" class="card-title">장애를 견디는 장치</text><line x1="924" y1="284" x2="1116" y2="284" class="rule"/><text x="924" y="312" class="card-copy">Gossip Protocol은</text><text x="924" y="336" class="card-copy">노드들이 서로</text><text x="924" y="360" class="card-copy">Heartbeat와 멤버십</text></g><rect x="64" y="452" width="1072" height="124" rx="10" class="takeaway-box"/><text x="88" y="482" class="takeaway-label">TAKEAWAY</text><text x="88" y="502" class="takeaway">분산 Key-Value Store의 핵심은 데이터를 여러 벌 두는 일이 아니라, 장애 중 읽기와 쓰기가 무엇을</text><text x="88" y="530" class="takeaway">약속할지 정하는 일이다.</text><text x="1136" y="610" text-anchor="end" class="eyebrow">LIQUIDSLR / SYSTEM-DESIGN-NOTES</text></svg></body></html>
