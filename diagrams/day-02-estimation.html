<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가정을 QPS와 용량으로 바꾸는 네 단계</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#f5f5f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
    svg{width:1200px;height:632px;display:block}
    .sans{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
    .mono{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
    .serif{font-family:'Instrument Serif','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',serif}
    .stage{fill:#fff;stroke:rgba(45,49,66,.28);stroke-width:1}
    .stage.focal{fill:rgba(235,108,54,.08);stroke:#eb6c36;stroke-width:1.2}
    .stage-title{fill:#2d3142;font-size:20px;font-weight:600}
    .formula{fill:#4f5d75;font-size:16px}
    .result{fill:#2d3142;font-size:16px;font-weight:600}
  </style>
</head>
<body>
  <svg viewBox="0 0 1200 632" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="day-02-estimation-title day-02-estimation-desc">
    <title id="day-02-estimation-title">가정을 QPS와 용량으로 바꾸는 네 단계</title>
    <desc id="day-02-estimation-desc">사용자 행동 가정을 하루 요청량, 평균 QPS, 피크 QPS, 저장 및 네트워크 용량으로 차례대로 바꾸는 계산 흐름.</desc>
    <defs>
      <marker id="day02-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
      <marker id="day02-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    </defs>
    <rect width="1200" height="632" fill="#f5f5f5"/>
    <text x="64" y="44" class="mono" fill="#4f5d75" font-size="8" font-weight="500" letter-spacing=".18em">SYSTEM DESIGN DAILY · DAY 02</text>
    <text x="64" y="88" class="serif" fill="#2d3142" font-size="40">숫자는 정답이 아니라, 설계의 방향이다</text>
    <text x="64" y="116" class="sans" fill="#4f5d75" font-size="16">가정에 단위를 붙이면 “큰 시스템”이 계산 가능한 문제로 바뀐다</text>

    <!-- Connectors first -->
    <line x1="264" y1="320" x2="356" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#day02-arrow)"/>
    <line x1="540" y1="320" x2="632" y2="320" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#day02-arrow-accent)"/>
    <line x1="816" y1="320" x2="908" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#day02-arrow)"/>
    <rect x="272" y="284" width="76" height="20" rx="2" fill="#f5f5f5"/><text x="310" y="300" class="mono" fill="#4f5d75" font-size="12" text-anchor="middle">÷ 86,400</text>
    <rect x="552" y="284" width="68" height="20" rx="2" fill="#f5f5f5"/><text x="586" y="300" class="mono" fill="#eb6c36" font-size="12" text-anchor="middle">× 피크</text>
    <rect x="828" y="284" width="68" height="20" rx="2" fill="#f5f5f5"/><text x="862" y="300" class="mono" fill="#4f5d75" font-size="12" text-anchor="middle">× 크기</text>

    <g class="sans" text-anchor="middle">
      <g><rect class="stage" x="80" y="248" width="184" height="144" rx="8"/><rect x="92" y="260" width="40" height="20" rx="2" fill="rgba(45,49,66,.10)"/><text x="112" y="275" class="mono" fill="#4f5d75" font-size="8" font-weight="600">01</text><text x="172" y="304" class="stage-title">가정</text><text x="172" y="336" class="mono formula">DAU × 행동 수</text><text x="172" y="368" class="result">2,000만 회/일</text></g>
      <g><rect class="stage" x="356" y="248" width="184" height="144" rx="8"/><rect x="368" y="260" width="40" height="20" rx="2" fill="rgba(45,49,66,.10)"/><text x="388" y="275" class="mono" fill="#4f5d75" font-size="8" font-weight="600">02</text><text x="448" y="304" class="stage-title">평균 QPS</text><text x="448" y="336" class="mono formula">요청 ÷ 초</text><text x="448" y="368" class="result">약 230 QPS</text></g>
      <g><rect class="stage focal" x="632" y="248" width="184" height="144" rx="8"/><rect x="644" y="260" width="40" height="20" rx="2" fill="rgba(235,108,54,.20)"/><text x="664" y="275" class="mono" fill="#eb6c36" font-size="8" font-weight="600">03</text><text x="724" y="304" class="stage-title">피크 QPS</text><text x="724" y="336" class="mono formula">평균 × 5</text><text x="724" y="368" class="result">약 1,150 QPS</text></g>
      <g><rect class="stage" x="908" y="248" width="184" height="144" rx="8"/><rect x="920" y="260" width="40" height="20" rx="2" fill="rgba(45,49,66,.10)"/><text x="940" y="275" class="mono" fill="#4f5d75" font-size="8" font-weight="600">04</text><text x="1000" y="304" class="stage-title">용량</text><text x="1000" y="336" class="mono formula">객체 수 × 크기</text><text x="1000" y="368" class="result">저장 · 대역폭</text></g>
    </g>

    <line x1="64" y1="480" x2="1136" y2="480" stroke="rgba(45,49,66,.12)" stroke-width="0.8"/>
    <text x="64" y="508" class="mono" fill="#4f5d75" font-size="8" letter-spacing=".18em">THE POINT</text>
    <text x="64" y="548" class="sans" fill="#2d3142" font-size="20" font-weight="600">정밀한 숫자보다 중요한 것</text>
    <text x="64" y="580" class="sans" fill="#4f5d75" font-size="16">가정 공개 · 단위 유지 · 평균과 피크 분리 · 복제와 보관 기간 반영</text>
    <text x="1136" y="580" class="serif" fill="#eb6c36" font-size="28" font-style="italic" text-anchor="end">Order of magnitude first.</text>
  </svg>
</body>
</html>
