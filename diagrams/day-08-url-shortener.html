<style>*{box-sizing:border-box}html,body{margin:0;width:1200px;height:632px;overflow:hidden}body{background:#f5f5f5;font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}svg{display:block;width:1200px;height:632px}.eyebrow,.step{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace;font-size:9px;font-weight:600;letter-spacing:.14em;fill:#4f5d75}.title{font-size:34px;font-weight:700;fill:#2d3142}.question{font-size:16px;fill:#4f5d75}.card{fill:#fff;stroke:rgba(45,49,66,.22)}.card.focal{fill:rgba(235,108,54,.07);stroke:#eb6c36;stroke-width:1.4}.card-title{font-size:16px;font-weight:700;fill:#2d3142}.card-copy{font-size:14px;fill:#4f5d75}.rule{stroke:rgba(45,49,66,.12)}.arrow{stroke:#4f5d75;stroke-width:1.2}.takeaway-box{fill:#2d3142}.takeaway-label{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace;font-size:9px;font-weight:600;letter-spacing:.14em;fill:#eb6c36}.takeaway{font-size:18px;font-weight:600;fill:#fff}</style></head>
<body><svg viewBox="0 0 1200 632" role="img" aria-labelledby="day-08-url-shortener-title day-08-url-shortener-desc"><title id="day-08-url-shortener-title">짧은 주소의 핵심은 문자열이 아니라 매핑이다</title><desc id="day-08-url-shortener-desc">짧은 키를 어떻게 만들고 빠르게 찾을까?</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs><rect width="1200" height="632" fill="#f5f5f5"/><text x="64" y="42" class="eyebrow">SYSTEM DESIGN DAILY / DAY 08</text><text x="64" y="88" class="title">짧은 주소의 핵심은 문자열이 아니라 매핑이다</text><text x="64" y="132" class="question">짧은 키를 어떻게 만들고 빠르게 찾을까?</text><line x1="296" y1="298" x2="340" y2="298" class="arrow" marker-end="url(#arrow)"/><line x1="576" y1="298" x2="620" y2="298" class="arrow" marker-end="url(#arrow)"/><line x1="856" y1="298" x2="900" y2="298" class="arrow" marker-end="url(#arrow)"/><g><rect class="card" x="64" y="188" width="232" height="220" rx="10"/><text x="84" y="214" class="step">01</text><text x="84" y="230" class="card-title">WHY: 짧게 만드는</text><text x="84" y="252" class="card-title">것보다 되돌리는 것이…</text><line x1="84" y1="284" x2="276" y2="284" class="rule"/><text x="84" y="312" class="card-copy">원문의 가정은 하루 1억 개의</text><text x="84" y="336" class="card-copy">새 URL, 읽기와 쓰기 비율</text><text x="84" y="360" class="card-copy">10대 1, 보관 기간…</text></g><g><rect class="card" x="344" y="188" width="232" height="220" rx="10"/><text x="364" y="214" class="step">02</text><text x="364" y="230" class="card-title">WHAT: 두 API와</text><text x="364" y="252" class="card-title">Redirect 의미</text><line x1="364" y1="284" x2="556" y2="284" class="rule"/><text x="364" y="312" class="card-copy">http</text></g><g><rect class="card focal" x="624" y="188" width="232" height="220" rx="10"/><text x="644" y="214" class="step">03</text><text x="644" y="230" class="card-title">키 생성 선택지</text><line x1="644" y1="284" x2="836" y2="284" class="rule"/><text x="644" y="312" class="card-copy">전역 Unique ID를 만든</text><text x="644" y="336" class="card-copy">뒤 0-9, a-z, A-Z의</text><text x="644" y="360" class="card-copy">62개 문자로 변환한다</text></g><g><rect class="card" x="904" y="188" width="232" height="220" rx="10"/><text x="924" y="214" class="step">04</text><text x="924" y="230" class="card-title">HOW: 쓰기와 읽기</text><text x="924" y="252" class="card-title">경로를 다르게…</text><line x1="924" y1="284" x2="1116" y2="284" class="rule"/><text x="924" y="312" class="card-copy">쓰기에서는 URL 형식과</text><text x="924" y="336" class="card-copy">Scheme을 검증하고, 같은</text><text x="924" y="360" class="card-copy">긴 URL에 같은 짧은 주소를</text></g><rect x="64" y="452" width="1072" height="124" rx="10" class="takeaway-box"/><text x="88" y="482" class="takeaway-label">TAKEAWAY</text><text x="88" y="502" class="takeaway">URL Shortener의 핵심은 짧은 문자열 생성이 아니라, 고유한 매핑을 빠르고 안전하게 되돌리는 읽기</text><text x="88" y="530" class="takeaway">경로다.</text><text x="1136" y="610" text-anchor="end" class="eyebrow">LIQUIDSLR / SYSTEM-DESIGN-NOTES</text></svg></body></html>
