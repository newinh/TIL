<style>*{box-sizing:border-box}html,body{margin:0;width:1200px;height:632px;overflow:hidden}body{background:#f5f5f5;font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}svg{display:block;width:1200px;height:632px}.eyebrow,.step{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace;font-size:9px;font-weight:600;letter-spacing:.14em;fill:#4f5d75}.title{font-size:34px;font-weight:700;fill:#2d3142}.question{font-size:16px;fill:#4f5d75}.card{fill:#fff;stroke:rgba(45,49,66,.22)}.card.focal{fill:rgba(235,108,54,.07);stroke:#eb6c36;stroke-width:1.4}.card-title{font-size:16px;font-weight:700;fill:#2d3142}.card-copy{font-size:14px;fill:#4f5d75}.rule{stroke:rgba(45,49,66,.12)}.arrow{stroke:#4f5d75;stroke-width:1.2}.takeaway-box{fill:#2d3142}.takeaway-label{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace;font-size:9px;font-weight:600;letter-spacing:.14em;fill:#eb6c36}.takeaway{font-size:18px;font-weight:600;fill:#fff}</style></head>
<body><svg viewBox="0 0 1200 632" role="img" aria-labelledby="day-07-unique-id-title day-07-unique-id-desc"><title id="day-07-unique-id-title">ID 한 개에도 시간과 위치를 담는다</title><desc id="day-07-unique-id-desc">충돌 없이 정렬 가능한 ID를 어떻게 만들까?</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs><rect width="1200" height="632" fill="#f5f5f5"/><text x="64" y="42" class="eyebrow">SYSTEM DESIGN DAILY / DAY 07</text><text x="64" y="88" class="title">ID 한 개에도 시간과 위치를 담는다</text><text x="64" y="132" class="question">충돌 없이 정렬 가능한 ID를 어떻게 만들까?</text><line x1="296" y1="298" x2="340" y2="298" class="arrow" marker-end="url(#arrow)"/><line x1="576" y1="298" x2="620" y2="298" class="arrow" marker-end="url(#arrow)"/><line x1="856" y1="298" x2="900" y2="298" class="arrow" marker-end="url(#arrow)"/><g><rect class="card" x="64" y="188" width="232" height="220" rx="10"/><text x="84" y="214" class="step">01</text><text x="84" y="230" class="card-title">WHY: 고유성만으로는</text><text x="84" y="252" class="card-title">충분하지 않다</text><line x1="84" y1="284" x2="276" y2="284" class="rule"/><text x="84" y="312" class="card-copy">ID 요구사항은 서비스마다</text><text x="84" y="336" class="card-copy">다르다</text></g><g><rect class="card" x="344" y="188" width="232" height="220" rx="10"/><text x="364" y="214" class="step">02</text><text x="364" y="230" class="card-title">WHAT: 네 가지</text><text x="364" y="252" class="card-title">선택지</text><line x1="364" y1="284" x2="556" y2="284" class="rule"/><text x="364" y="312" class="card-copy">Multi-master auto</text><text x="364" y="336" class="card-copy">increment는 서버마다</text><text x="364" y="360" class="card-copy">시작점과 증가 폭을 다르게 둔다</text></g><g><rect class="card focal" x="624" y="188" width="232" height="220" rx="10"/><text x="644" y="214" class="step">03</text><text x="644" y="230" class="card-title">HOW: 생성보다 운영</text><text x="644" y="252" class="card-title">규칙이 더 중요하다</text><line x1="644" y1="284" x2="836" y2="284" class="rule"/><text x="644" y="312" class="card-copy">ID 생성 과정은 짧다</text></g><g><rect class="card" x="904" y="188" width="232" height="220" rx="10"/><text x="924" y="214" class="step">04</text><text x="924" y="230" class="card-title">실무 예와 트레이드오프</text><line x1="924" y1="284" x2="1116" y2="284" class="rule"/><text x="924" y="312" class="card-copy">주문 ID를 Snowflake로</text><text x="924" y="336" class="card-copy">만들면 생성 시각 기준으로 대략</text><text x="924" y="360" class="card-copy">정렬돼 데이터베이스…</text></g><rect x="64" y="452" width="1072" height="124" rx="10" class="takeaway-box"/><text x="88" y="482" class="takeaway-label">TAKEAWAY</text><text x="88" y="502" class="takeaway">분산 ID는 숫자를 세는 문제가 아니라, 시간과 생성 주체와 같은 순간의 순서를 겹치지 않게 인코딩하는 문제다.</text><text x="1136" y="610" text-anchor="end" class="eyebrow">LIQUIDSLR / SYSTEM-DESIGN-NOTES</text></svg></body></html>
