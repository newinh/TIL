<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시스템 설계의 네 단계</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#f5f5f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
    svg{width:1200px;height:632px;display:block}
    .sans{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
    .mono{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
    .serif{font-family:'Instrument Serif','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',serif}
    .stage{fill:#fff;stroke:rgba(45,49,66,.24);stroke-width:1}
    .stage.focal{fill:rgba(235,108,54,.08);stroke:#eb6c36;stroke-width:1.2}
    .slot-label{fill:#7a8399;font-size:8px;font-weight:600;letter-spacing:.12em}
    .slot-text{fill:#2d3142;font-size:14px;font-weight:500}
    .stage-title{fill:#2d3142;font-size:16px;font-weight:600}
  </style>
</head>
<body>
  <svg viewBox="0 0 1200 632" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="day-03-framework-title day-03-framework-desc">
    <title id="day-03-framework-title">시스템 설계의 네 단계</title>
    <desc id="day-03-framework-desc">범위 합의, 개략 설계, 핵심부 깊이 파기, 마무리의 네 단계마다 핵심 질문과 산출물, 피해야 할 함정을 비교한 프레임워크.</desc>
    <defs>
      <marker id="day03-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
      <marker id="day03-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    </defs>
    <rect width="1200" height="632" fill="#f5f5f5"/>
    <text x="64" y="44" class="mono" fill="#4f5d75" font-size="8" font-weight="500" letter-spacing=".18em">SYSTEM DESIGN DAILY · DAY 03</text>
    <text x="64" y="88" class="serif" fill="#2d3142" font-size="40">설계보다 먼저 합의하라</text>
    <text x="64" y="116" class="sans" fill="#4f5d75" font-size="16">같은 슬롯으로 네 단계를 비교하면, 지금 무엇을 해야 하는지 놓치지 않는다</text>

    <!-- Stage handoff arrows first -->
    <line x1="296" y1="180" x2="344" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#day03-arrow)"/>
    <line x1="576" y1="180" x2="624" y2="180" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#day03-arrow-accent)"/>
    <line x1="856" y1="180" x2="904" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#day03-arrow)"/>

    <!-- Stage headers -->
    <g class="sans" text-anchor="middle">
      <g><rect class="stage" x="64" y="148" width="232" height="64" rx="8"/><text x="84" y="172" class="mono" fill="#4f5d75" font-size="8">01</text><text x="180" y="188" class="stage-title">범위 합의</text></g>
      <g><rect class="stage" x="344" y="148" width="232" height="64" rx="8"/><text x="364" y="172" class="mono" fill="#4f5d75" font-size="8">02</text><text x="460" y="188" class="stage-title">개략 설계</text></g>
      <g><rect class="stage focal" x="624" y="148" width="232" height="64" rx="8"/><text x="644" y="172" class="mono" fill="#eb6c36" font-size="8">03</text><text x="740" y="188" class="stage-title">핵심부 깊이 파기</text></g>
      <g><rect class="stage" x="904" y="148" width="232" height="64" rx="8"/><text x="924" y="172" class="mono" fill="#4f5d75" font-size="8">04</text><text x="1020" y="188" class="stage-title">마무리</text></g>
    </g>

    <!-- Consistent semantic slots -->
    <g class="sans">
      <g><rect class="stage" x="64" y="232" width="232" height="232" rx="8"/><text x="84" y="260" class="mono slot-label">QUESTION</text><text x="84" y="284" class="slot-text">무엇을 만들고</text><text x="84" y="304" class="slot-text">무엇은 빼는가?</text><line x1="84" y1="324" x2="276" y2="324" stroke="rgba(45,49,66,.12)"/><text x="84" y="348" class="mono slot-label">OUTPUT</text><text x="84" y="372" class="slot-text">요구사항 · 규모 · SLO</text><line x1="84" y1="392" x2="276" y2="392" stroke="rgba(45,49,66,.12)"/><text x="84" y="416" class="mono slot-label">TRAP</text><text x="84" y="440" class="slot-text">질문 없이 DB부터 그리기</text></g>
      <g><rect class="stage" x="344" y="232" width="232" height="232" rx="8"/><text x="364" y="260" class="mono slot-label">QUESTION</text><text x="364" y="284" class="slot-text">주요 요청은 어디를</text><text x="364" y="304" class="slot-text">지나가는가?</text><line x1="364" y1="324" x2="556" y2="324" stroke="rgba(45,49,66,.12)"/><text x="364" y="348" class="mono slot-label">OUTPUT</text><text x="364" y="372" class="slot-text">큰 상자 · 데이터 흐름</text><line x1="364" y1="392" x2="556" y2="392" stroke="rgba(45,49,66,.12)"/><text x="364" y="416" class="mono slot-label">TRAP</text><text x="364" y="440" class="slot-text">합의 없이 세부로 진입</text></g>
      <g><rect class="stage focal" x="624" y="232" width="232" height="232" rx="8"/><text x="644" y="260" class="mono slot-label" fill="#eb6c36">QUESTION</text><text x="644" y="284" class="slot-text">실패하면 전체를</text><text x="644" y="304" class="slot-text">무너뜨리는 곳은?</text><line x1="644" y1="324" x2="836" y2="324" stroke="rgba(235,108,54,.20)"/><text x="644" y="348" class="mono slot-label" fill="#eb6c36">OUTPUT</text><text x="644" y="372" class="slot-text">핵심 알고리즘 · 트레이드오프</text><line x1="644" y1="392" x2="836" y2="392" stroke="rgba(235,108,54,.20)"/><text x="644" y="416" class="mono slot-label" fill="#eb6c36">TRAP</text><text x="644" y="440" class="slot-text">모든 상자를 같은 깊이로</text></g>
      <g><rect class="stage" x="904" y="232" width="232" height="232" rx="8"/><text x="924" y="260" class="mono slot-label">QUESTION</text><text x="924" y="284" class="slot-text">어디서 깨지고</text><text x="924" y="304" class="slot-text">다음은 무엇인가?</text><line x1="924" y1="324" x2="1116" y2="324" stroke="rgba(45,49,66,.12)"/><text x="924" y="348" class="mono slot-label">OUTPUT</text><text x="924" y="372" class="slot-text">병목 · 장애 · 다음 확장</text><line x1="924" y1="392" x2="1116" y2="392" stroke="rgba(45,49,66,.12)"/><text x="924" y="416" class="mono slot-label">TRAP</text><text x="924" y="440" class="slot-text">끝까지 새 부품 추가하기</text></g>
    </g>

    <line x1="64" y1="508" x2="1136" y2="508" stroke="rgba(45,49,66,.12)" stroke-width="0.8"/>
    <text x="64" y="536" class="mono" fill="#4f5d75" font-size="8" letter-spacing=".18em">45-MINUTE GUIDE</text>
    <text x="64" y="576" class="sans" fill="#2d3142" font-size="16">5분 범위</text><text x="248" y="576" class="sans" fill="#2d3142" font-size="16">10~15분 개략</text><text x="512" y="576" class="sans" fill="#eb6c36" font-size="16">20분 깊이 파기</text><text x="792" y="576" class="sans" fill="#2d3142" font-size="16">5분 마무리</text><text x="1136" y="576" class="serif" fill="#4f5d75" font-size="28" font-style="italic" text-anchor="end">Agreement before detail.</text>
  </svg>
</body>
</html>
