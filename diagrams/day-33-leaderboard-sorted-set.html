 y="230" class="card-title">동점은 제품 규칙이다</text><line x1="644" y1="284" x2="836" y2="284" class="rule"/><text x="644" y="312" class="card-copy">Redis rank는 사용자마다</text><text x="644" y="336" class="card-copy">고유 위치를 부여한다</text></g><g><rect class="card" x="904" y="188" width="232" height="220" rx="10"/><text x="924" y="214" class="step">04</text><text x="924" y="230" class="card-title">Redis 장애에</text><text x="924" y="252" class="card-title">대비한다</text><line x1="924" y1="284" x2="1116" y2="284" class="rule"/><text x="924" y="312" class="card-copy">Redis 복제본과 장애 전환,</text><text x="924" y="336" class="card-copy">AOF나 Snapshot을</text><text x="924" y="360" class="card-copy">설정해도 인정하는 데이터 손실…</text></g><rect x="64" y="452" width="1072" height="124" rx="10" class="takeaway-box"/><text x="88" y="482" class="takeaway-label">TAKEAWAY</text><text x="88" y="502" class="takeaway">실시간 순위표는 점수가 바뀔 때 순서를 함께 갱신해 읽기 때의 정렬을 없앤다.</text><text x="1136" y="610" text-anchor="end" class="eyebrow">LIQUIDSLR / SYSTEM-DESIGN-NOTES</text></svg></body></html>
